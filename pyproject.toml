[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-news-ocr"
version = "1.0.0"
description = "Reproducible temporal-consensus OCR for static news lower-thirds and scrolling tickers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sukhraj Singh" }]
dependencies = [
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<6",
  "rapidfuzz>=3.9,<4",
  "rapidocr>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
news-ocr = "headline_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
